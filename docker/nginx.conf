server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml image/webp;

  location = /api/health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Runtime config — nunca cachear por dias
  location = /env.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
    expires -1;
    try_files $uri =404;
  }

  # __BETA_SLOTS_PROXY__

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets com hash do Vite — cache longo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
